  name: Update LeetCode Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: joshcangit/leetcode-readme-stats@v1.3
        with:
          username: Staylor72
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update LeetCode stats"